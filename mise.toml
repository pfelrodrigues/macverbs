# macverbs — project isolation via mise
# Swift compiler + `swift format`: Apple CLT/Xcode on PATH.
# Human/agent entrypoints: `mise run <task>`.

min_version = "2025.8.0"

[env]
MACVERBS_ROOT = "{{config_root}}"
MACVERBS_CONFIG_DIR = "~/.config/macverbs"

[tasks.resolve]
description = "Resolve Swift package dependencies"
run = "swift package resolve"

[tasks.build]
description = "Build debug binary"
run = "swift build"

[tasks.test]
description = "Run unit tests"
run = "bash scripts/swift_test.sh"

[tasks.format]
description = "Format Swift sources in place (swift format)"
run = "swift format --configuration .swift-format --recursive --in-place --parallel Sources Tests Package.swift"

[tasks.format-check]
description = "Check formatting without writing"
run = "swift format lint --configuration .swift-format --recursive --parallel --strict Sources Tests Package.swift"

[tasks.lint]
description = "Lint style rules (same engine as format: swift format lint)"
run = "swift format lint --configuration .swift-format --recursive --parallel --strict Sources Tests Package.swift"

[tasks.coverage]
description = "Unit tests + llvm-cov line report (Sources/MacverbsCore); COVERAGE_MIN=97 optional"
run = "bash scripts/coverage.sh"

[tasks.check]
description = "Format-check/lint + build + test (agent / CI gate)"
depends = ["format-check", "build", "test"]
run = "echo check-ok"

[tasks.check-coverage]
description = "Full check + coverage gate (default min 97% lines on Sources)"
depends = ["format-check", "build"]
run = "COVERAGE_MIN=97 bash scripts/coverage.sh"

[tasks.run]
description = "Run macverbs (args after --)"
run = "bash scripts/macverbs_run.sh {{arg(name='cli_args', var=true, default='')}}"

[tasks.version]
description = "Print toolchain identity"
run = """
swift --version
swift format --version
git rev-parse --short HEAD 2>/dev/null || true
"""

[tasks.hooks-install]
description = "Point this repo at .githooks (core.hooksPath)"
run = "bash scripts/install-git-hooks.sh"

[tasks.setup]
description = "Install git hooks (swift format + conventional commits)"
depends = ["hooks-install"]
run = "echo setup-ok"

[tasks.generate-completions]
description = "Regenerate fish/zsh/bash completions from the built binary"
depends = ["build"]
run = "bash scripts/generate-completions.sh"
