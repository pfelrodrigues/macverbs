# macOS runner is expensive — not on every PR by default.
# - workflow_dispatch: pre-release / ad-hoc (optional coverage input)
# - schedule: weekly smoke + coverage report artifact
# - pull_request + label ci-macos: opt-in full build on a PR
# Local gate remains: `mise run check` on a Mac with Swift.
#
# Note: default CI on Linux only runs `swift format` — the macOS product target
# does not build under Linux (EventKit / Apple frameworks).
name: macOS check

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run macOS CI (optional note)"
        required: false
        default: "manual verification"
      coverage:
        description: "Also run llvm-cov and upload summary"
        type: boolean
        default: true
  schedule:
    # Mondays 12:00 UTC — smoke + coverage
    - cron: "0 12 * * 1"
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize, reopened]

jobs:
  build-test:
    name: build + test (macos)
    runs-on: macos-15
    if: >
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci-macos')
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Swift version
        run: |
          swift --version
          swift format --version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "dispatch reason: ${{ inputs.reason }}"
          fi

      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Format lint (strict)
        run: |
          swift format lint \
            --configuration .swift-format \
            --recursive --parallel --strict \
            Sources Tests Package.swift

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        run: bash scripts/swift_test.sh

      # Weekly schedule always; workflow_dispatch when coverage input is true.
      - name: Coverage summary
        if: >
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.coverage)
        run: |
          bash scripts/swift_test.sh --enable-code-coverage
          BIN="$(find .build -type f -path '*macverbsPackageTests.xctest/Contents/MacOS/macverbsPackageTests' ! -path '*.dSYM*' | head -1)"
          PROF="$(find .build -name 'default.profdata' | head -1)"
          xcrun llvm-cov report "$BIN" -instr-profile="$PROF" \
            -ignore-filename-regex='.build|Tests|checkouts|runner.swift|ArgumentParser' \
            | tee coverage-report.txt

      - name: Upload coverage report
        if: >
          github.event_name == 'schedule' ||
          (github.event_name == 'workflow_dispatch' && inputs.coverage)
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage-report.txt
