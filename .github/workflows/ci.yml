# Cheap default CI: Linux format only.
# The product is macOS-only (EventKit / Apple Events); full build+test runs on
# macOS — see macos-check.yml (schedule, workflow_dispatch, or PR label ci-macos).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: swift format (linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Swift / format version
        run: |
          swift --version
          swift format --version

      - name: Format lint (strict)
        run: |
          swift format lint \
            --configuration .swift-format \
            --recursive --parallel --strict \
            Sources Tests Package.swift
