name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: format + build + test
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift version
        run: |
          swift --version
          swift format --version

      - name: Format / lint (swift format)
        run: |
          swift format lint \
            --configuration .swift-format \
            --recursive --parallel --strict \
            Sources Tests Package.swift

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Test
        run: swift test
