# Cheap default CI: Linux only.
# Full macOS build+test is manual — see macos-check.yml (workflow_dispatch).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: swift format (linux)
    runs-on: ubuntu-latest
    container:
      image: swift:6.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift / format version
        run: |
          swift --version
          swift format --version

      - name: Format lint (strict)
        run: |
          swift format lint \
            --configuration .swift-format \
            --recursive --parallel --strict \
            Sources Tests Package.swift
